<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jadwal Harian Izzulhaq</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
<style>
  body { 
    font-family: Arial, sans-serif; 
    max-width: 600px; 
    margin: 20px auto; 
    padding: 10px;
    transition: background-color 0.5s ease; /* transisi warna background */
    color: #fff;
    text-align: center;
  }
  #waktu {
    font-size: 1.2rem;
    margin-bottom: 12px;
    font-weight: 600;
  }
  h1 {
    margin-bottom: 10px;
  }
  /* Styling untuk quotes */
  .quotes {
    font-style: italic;
    margin-bottom: 20px;
    padding: 10px;
    background-color: rgba(255, 255, 255, 0.1);
    border-radius: 5px;
    font-size: 0.9rem;
  }
  .author {
    font-weight: bold;
    display: block;
    margin-top: 5px;
    font-size: 0.8rem;
  }
  h2 { 
    border-bottom: 1px solid rgba(255,255,255,0.3); 
    padding-bottom: 5px; 
    text-align: left;
  }
  label { 
    display: block; 
    margin: 10px 0; 
    cursor: pointer;
    text-align: left;
  }
  input[type="checkbox"] {
    cursor: pointer;
  }
  
  /* Styling untuk label dengan checkbox yang dicentang */
  label input[type="checkbox"]:checked + span {
    color: #a3e4d7;
    text-decoration: line-through;
    transition: all 0.3s ease;
  }

  /* Container untuk teks label */
  .task-text {
    display: inline-block;
    transition: transform 0.2s ease, color 0.3s ease;
    padding-left: 5px;
  }

  /* Animasi untuk label yang baru dicentang */
  @keyframes taskComplete {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  .task-complete-animation {
    animation: taskComplete 0.4s ease;
  }
  
  /* Styling untuk tombol reset */
  #resetButton {
    background-color: rgba(231, 76, 60, 0.8);
    color: white;
    border: none;
    padding: 10px 20px;
    margin-top: 20px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.3s ease;
    display: none; /* Sembunyikan secara default */
  }
  
  #resetButton:hover {
    background-color: rgba(231, 76, 60, 1);
    transform: scale(1.05);
  }
  
  #resetButton.show {
    display: inline-block;
    animation: fadeIn 0.5s ease;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  /* Styling untuk tombol vibrate */
  #vibrateButton {
    background: none;
    border: none;
    color: rgba(255, 255, 255, 0.7);
    font-size: 1.5rem;
    cursor: pointer;
    position: absolute;
    top: 20px;
    right: 20px;
    transition: color 0.3s ease;
  }
  
  #vibrateButton:hover {
    color: rgba(255, 255, 255, 1);
  }
</style>
</head>
<body>

<!-- Tombol Vibrate -->
<button id="vibrateButton">📳</button>

<div id="waktu">Memuat waktu...</div>

<h1>Jadwal Harian untuk Izzulhaq</h1>

<div class="quotes">
  "PERUBAHAN KECIL YANG MEMBERIKAN HASIL LUAR BIASA"
  <span class="author">— James Clear</span>
</div>

<section>
  <h2>Pagi (Before School)</h2>
  <label><input type="checkbox" id="bangunPagi" /><span class="task-text">Bangun Pagi: 06.00</span></label>
  <label><input type="checkbox" id="stretching" /><span class="task-text">Stretching Ringan / Olahraga Singkat (5–10 menit)</span></label>
  <label><input type="checkbox" id="bacaBukuPagi" /><span class="task-text">Baca Buku (Atomic Habits atau Rich Dad Poor Dad, 10–15 menit)</span></label>
  <label><input type="checkbox" id="sarapan" /><span class="task-text">Sarapan + Persiapan ke Sekolah</span></label>
</section>

<section>
  <h2>Siang (After School)</h2>
  <label><input type="checkbox" id="reviewPelajaran" /><span class="task-text">Review Pelajaran Sekolah: Fokus pelajaran teknik (minimal 20 menit)</span></label>
  <label><input type="checkbox" id="belajarSNBP" /><span class="task-text">Belajar Materi SNBP/SNBT (40 menit)</span></label>
  <label><input type="checkbox" id="editKontenSiang" /><span class="task-text">Edit Konten (30–45 menit)</span></label>
</section>

<section>
  <h2>Sore</h2>
  <label><input type="checkbox" id="olahragaSore" /><span class="task-text">Olahraga: Workout ringan atau lari (20–30 menit)</span></label>
  <label><input type="checkbox" id="belajarInggris" /><span class="task-text">Belajar Bahasa Inggris (20 menit)</span></label>
  <label><input type="checkbox" id="crypto" /><span class="task-text">Crypto: Belajar tentang crypto atau blockchain (20 menit)</span></label>
  <label><input type="checkbox" id="bacaTeknik" /><span class="task-text">Baca Artikel/Buku Teknik (20 menit)</span></label>
</section>

<section>
  <h2>Malam (Before Sleep)</h2>
  <label><input type="checkbox" id="kerjakanSoal" /><span class="task-text">Kerjakan Soal SNBP/SNBT (20 menit)</span></label>
  <label><input type="checkbox" id="editKontenMalam" /><span class="task-text">Lanjut Edit Konten (30 menit)</span></label>
  <label><input type="checkbox" id="cekProgress" /><span class="task-text">Cek Progress Checklist & Catatan</span></label>
</section>

<section>
  <h2>Before Bed</h2>
  <label><input type="checkbox" id="meditasi" /><span class="task-text">Meditasi atau Relax (5 menit)</span></label>
  <label><input type="checkbox" id="tidur" /><span class="task-text">Tidur pukul 22.00 – 22.30</span></label>
</section>

<!-- Tombol Reset -->
<button id="resetButton">Reset Semua Tugas</button>

<script>
  // Status getaran (vibration)
  let vibrationEnabled = true;

  // Fungsi untuk menghasilkan getaran (vibration)
  function vibrate(pattern) {
    if (vibrationEnabled && 'vibrate' in navigator) {
      try {
        navigator.vibrate(pattern);
      } catch (e) {
        console.log("Getaran tidak didukung di perangkat ini atau izin getaran ditolak");
      }
    }
  }
  
  // Event listener untuk tombol vibrate
  document.getElementById('vibrateButton').addEventListener('click', function() {
    vibrationEnabled = !vibrationEnabled;
    this.textContent = vibrationEnabled ? '📳' : '📴';
    
    // Getaran singkat untuk menunjukkan perubahan status
    if (vibrationEnabled) {
      vibrate(100);
    }
  });

  // Tampilkan jam dan hari dalam Bahasa Indonesia, update setiap detik
  function updateWaktu() {
    const el = document.getElementById('waktu');
    const now = new Date();

    const hariNames = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    const hari = hariNames[now.getDay()];

    // Format jam:menit:detik dengan dua digit
    const jam = String(now.getHours()).padStart(2, '0');
    const menit = String(now.getMinutes()).padStart(2, '0');
    const detik = String(now.getSeconds()).padStart(2, '0');

    el.textContent = `${hari}, ${jam}:${menit}:${detik}`;
  }
  setInterval(updateWaktu, 1000);
  updateWaktu(); // update langsung saat load

  // Semua ID checklist
  const ids = [
    'bangunPagi', 'stretching', 'bacaBukuPagi', 'sarapan',
    'reviewPelajaran', 'belajarSNBP', 'editKontenSiang',
    'olahragaSore', 'belajarInggris', 'crypto', 'bacaTeknik',
    'kerjakanSoal', 'editKontenMalam', 'cekProgress',
    'meditasi', 'tidur'
  ];

  const DATE_KEY = 'jadwal_tanggal';
  const CHECKLIST_KEY = 'jadwal_status';
  const VIBRATION_KEY = 'jadwal_vibration';

  function getTodayString() {
    const d = new Date();
    return d.toISOString().slice(0,10); // format yyyy-mm-dd
  }

  function getColorByDate(dateStr) {
    const colors = [
      '#f39c12', '#1abc9c', '#3498db', '#9b59b6', '#e67e22',
      '#e74c3c', '#34495e', '#16a085', '#d35400', '#27ae60',
      '#8e44ad', '#2ecc71'
    ];
    let hash = 0;
    for (let i = 0; i < dateStr.length; i++) {
      hash = dateStr.charCodeAt(i) + ((hash << 5) - hash);
    }
    return colors[Math.abs(hash) % colors.length];
  }

  function loadChecklist() {
    const savedDate = localStorage.getItem(DATE_KEY);
    const today = getTodayString();

    // Debugging log untuk memastikan tanggal
    console.log("Saved Date:", savedDate);
    console.log("Today's Date:", today);

    // Set warna latar harian
    document.body.style.backgroundColor = getColorByDate(today);

    if (savedDate !== today) {
      console.log("Hari baru, reset checklist!");
      ids.forEach(id => document.getElementById(id).checked = false); // Reset semua checkbox
      localStorage.setItem(DATE_KEY, today); // Simpan tanggal baru
      localStorage.removeItem(CHECKLIST_KEY); // Hapus status checklist lama
      saveChecklist(); // Simpan default kosong
    } else {
      console.log("Load status checklist sebelumnya");
      let status = localStorage.getItem(CHECKLIST_KEY);
      if (status) {
        status = JSON.parse(status);
        ids.forEach(id => {
          const checked = status[id];
          if (typeof checked === 'boolean') {
            document.getElementById(id).checked = checked;
          }
        });
      }
    }
    
    // Load pengaturan getaran
    const savedVibrationSetting = localStorage.getItem(VIBRATION_KEY);
    if (savedVibrationSetting !== null) {
      vibrationEnabled = savedVibrationSetting === 'true';
      document.getElementById('vibrateButton').textContent = vibrationEnabled ? '📳' : '📴';
    }
    
    // Periksa status tombol reset
    checkAllTasksCompleted();
  }

  function saveChecklist() {
    const status = {};
    ids.forEach(id => {
      status[id] = document.getElementById(id).checked;
    });
    localStorage.setItem(CHECKLIST_KEY, JSON.stringify(status));
    
    // Simpan pengaturan getaran
    localStorage.setItem(VIBRATION_KEY, vibrationEnabled.toString());
  }

  // Fungsi untuk menangani animasi saat checkbox dicentang
  function setupAnimations() {
    ids.forEach(id => {
      const checkbox = document.getElementById(id);
      checkbox.addEventListener('change', function() {
        if (this.checked) {
          // Dapatkan elemen span yang mengikuti checkbox
          const textSpan = this.nextElementSibling;
          // Tambahkan kelas animasi
          textSpan.classList.add('task-complete-animation');
          // Hapus kelas setelah animasi selesai
          setTimeout(() => {
            textSpan.classList.remove('task-complete-animation');
          }, 500);
          
          // Getaran untuk tugas yang dicentang
          vibrate([50]);
        }
      });
    });
  }

  // Fungsi untuk memeriksa apakah semua tugas sudah selesai
  function checkAllTasksCompleted() {
    const allTasks = ids.map(id => document.getElementById(id).checked);
    const allCompleted = allTasks.every(task => task === true);
    const resetButton = document.getElementById('resetButton');
    
    if (allCompleted) {
      // Jalankan efek konfeti
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 }
      });
      
      // Getaran panjang untuk memberitahu semua tugas selesai
      vibrate([100, 50, 100, 50, 100]);
      
      // Tampilkan tombol reset
      resetButton.classList.add('show');
    } else {
      // Sembunyikan tombol reset jika tidak semua tugas selesai
      resetButton.classList.remove('show');
    }
  }

  // Fungsi untuk mereset semua tugas
  function resetAllTasks() {
    ids.forEach(id => {
      document.getElementById(id).checked = false;
    });
    saveChecklist();
    checkAllTasksCompleted(); // Sembunyikan tombol reset
    
    // Getaran untuk reset
    vibrate([200, 100, 200]);
    
    // Animasi konfirmasi reset
    confetti({
      particleCount: 30,
      spread: 100,
      origin: { y: 0.8 },
      colors: ['#e74c3c', '#f39c12', '#e67e22'] // Warna merah/oranye untuk reset
    });
  }

  // Atur event listeners untuk checkbox
  ids.forEach(id => {
    document.getElementById(id).addEventListener('change', function() {
      saveChecklist();
      checkAllTasksCompleted();
    });
  });

  // Tambah event listener untuk tombol reset
  document.getElementById('resetButton').addEventListener('click', resetAllTasks);

  loadChecklist();
  setupAnimations();
</script>

</body>
</html>
